name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Build the amd64 half of the universal binary
        if: matrix.os == 'macos-latest'
        run: go build ./...
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64

  windows-arm64:
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
